<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDG Girona Attendee Survey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-subtle: #F1F5F9;
      --ink: #0F172A;
      --ink-muted: #475569;
      --border: #CBD5E1;
      --g-blue: #4285F4;
      --g-red: #EA4335;
      --g-yellow: #FBBC05;
      --g-green: #34A853;
      --active-accent: #4285F4;
      --active-soft: #EFF6FF;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-card: 0 10px 30px -10px rgba(15, 23, 42, 0.08), 0 0 0 1.5px #0F172A;
      --shadow-btn: 0 4px 0 #0F172A;
      --shadow-btn-sm: 0 3px 0 #0F172A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, rgba(66, 133, 244, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(66, 133, 244, 0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .display-font {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.02em;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Top Bar (Always visible for language toggle) */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(248, 250, 252, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(15, 23, 42, 0.1);
      padding: 12px 20px;
    }

    .top-bar-inner {
      max-width: 640px;
      margin: 0 auto;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .g-dots {
      display: inline-flex;
      gap: 4px;
    }

    .g-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
    }

    .g-dots span:nth-child(1) { background: var(--g-blue); }
    .g-dots span:nth-child(2) { background: var(--g-red); }
    .g-dots span:nth-child(3) { background: var(--g-yellow); }
    .g-dots span:nth-child(4) { background: var(--g-green); }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-switch {
      display: inline-flex;
      background: var(--surface);
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 2px;
      box-shadow: 0 2px 0 var(--ink);
    }

    .lang-btn {
      border: none;
      background: transparent;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--ink-muted);
      transition: all 0.15s ease;
    }

    .lang-btn.active {
      background: var(--ink);
      color: #FFF;
    }

    .step-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      background: var(--surface);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1.5px solid var(--ink);
    }

    /* 4-Stage Google Color Progress Bar */
    .stage-track {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .stage-seg {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stage-seg-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage-seg.active .stage-seg-label,
    .stage-seg.done .stage-seg-label {
      color: var(--ink);
    }

    .stage-seg-bar {
      height: 6px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(15, 23, 42, 0.2);
    }

    .stage-seg-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #seg-0 .stage-seg-fill { background: var(--g-blue); }
    #seg-1 .stage-seg-fill { background: var(--g-red); }
    #seg-2 .stage-seg-fill { background: var(--g-yellow); }
    #seg-3 .stage-seg-fill { background: var(--g-green); }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 105px;
    }

    .card-stage {
      width: 100%;
      max-width: 640px;
      position: relative;
    }

    .slide {
      animation: slideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .slide.back {
      animation: slideInBack 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes slideInBack {
      from { opacity: 0; transform: translateY(-14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Welcome Card */
    .welcome-card {
      background: var(--surface);
      border-radius: 26px;
      padding: 36px 30px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .welcome-stripe {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 7px;
      background: linear-gradient(90deg, var(--g-blue) 0% 25%, var(--g-red) 25% 50%, var(--g-yellow) 50% 75%, var(--g-green) 75% 100%);
    }

    .welcome-title {
      font-size: clamp(32px, 6vw, 44px);
      line-height: 1.08;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--ink);
    }

    .welcome-desc {
      font-size: 16.5px;
      line-height: 1.58;
      color: var(--ink-muted);
      margin-bottom: 28px;
    }

    /* Question Headers */
    .q-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink);
      background: var(--active-soft);
      border: 1.5px solid var(--ink);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .q-eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--active-accent);
    }

    .q-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(24px, 4.8vw, 32px);
      line-height: 1.2;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .q-subtitle {
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--ink-muted);
      margin-bottom: 22px;
    }

    /* Choice Cards */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-card {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: var(--shadow-btn-sm);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
      font-family: inherit;
      color: var(--ink);
    }

    .option-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 var(--ink);
      background: #FAFCFF;
    }

    .option-card:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .option-card.selected {
      background: var(--active-soft);
      box-shadow: 0 3px 0 var(--active-accent);
    }

    .option-emoji {
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      background: var(--surface-subtle);
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-card.selected .option-emoji {
      background: var(--surface);
    }

    .option-text {
      flex: 1;
    }

    .option-title {
      font-weight: 700;
      font-size: 15.5px;
      line-height: 1.3;
    }

    .option-desc {
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 2px;
      line-height: 1.35;
    }

    .option-key {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-muted);
      border: 1.5px solid var(--border);
      background: var(--surface-subtle);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-card.selected .option-key {
      background: var(--active-accent);
      color: #FFF;
      border-color: var(--ink);
    }

    /* Rank / Sort Cards (Q7) */
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rank-item {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-btn-sm);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .rank-item.top-pick {
      background: #FEF2F2;
      box-shadow: 0 3px 0 var(--g-red);
    }

    .rank-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 14px;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--surface-subtle);
      border: 1.5px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .rank-item.top-pick .rank-badge {
      background: var(--g-red);
      color: #FFF;
    }

    .rank-controls {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .rank-arrow {
      width: 30px;
      height: 24px;
      border: 1.5px solid var(--ink);
      background: var(--surface-subtle);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
    }

    .rank-arrow:hover:not(:disabled) {
      background: var(--ink);
      color: #FFF;
    }

    .rank-arrow:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }

    /* Tag Cloud */
    .tags-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 12px;
    }

    .tag-pill {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 2px 0 var(--ink);
      transition: all 0.12s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tag-pill:hover {
      transform: translateY(-1px);
      background: #FFF;
    }

    .tag-pill.selected {
      background: var(--active-accent);
      color: #FFF;
      box-shadow: 0 2px 0 var(--ink);
    }

    /* Yellow accent needs dark ink text for contrast */
    .tag-pill.selected.yellow-ink {
      color: var(--ink);
    }

    .tag-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    /* Demographics Dual Block */
    .demo-section {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-btn-sm);
      margin-bottom: 14px;
    }

    .demo-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
      margin-bottom: 10px;
      display: block;
    }

    .mini-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mini-pill {
      background: var(--surface-subtle);
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      color: var(--ink);
      transition: all 0.12s ease;
    }

    .mini-pill.selected {
      background: var(--g-green);
      color: #FFF;
      box-shadow: 0 2px 0 var(--ink);
    }

    /* Text Inputs */
    .text-input {
      width: 100%;
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: var(--radius-md);
      padding: 15px 16px;
      font-size: 15.5px;
      font-family: inherit;
      color: var(--ink);
      box-shadow: var(--shadow-btn-sm);
      outline: none;
      transition: box-shadow 0.15s;
    }

    .text-input:focus {
      background: #FFF;
      box-shadow: 0 4px 0 var(--active-accent);
    }

    .text-input::placeholder {
      color: #94A3B8;
    }

    .input-error {
      color: var(--g-red);
      font-size: 13px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* Buttons */
    .btn-primary {
      background: var(--g-blue);
      color: #FFFFFF;
      border: 2px solid var(--ink);
      border-radius: var(--radius-md);
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .btn-primary:hover {
      filter: brightness(0.95);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--ink);
    }

    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: var(--shadow-btn-sm);
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary:hover {
      background: var(--surface-subtle);
    }

    /* Footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(248, 250, 252, 0.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(15, 23, 42, 0.1);
      padding: 12px 20px;
      z-index: 20;
    }

    .footer-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hint-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--ink-muted);
      font-weight: 600;
    }

    /* Result & Tourist T-Shirt Preview */
    .result-card {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 26px;
      padding: 28px 24px;
      box-shadow: 0 6px 0 var(--ink);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .archetype-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ECFDF5;
      color: #065F46;
      border: 1.5px solid var(--ink);
      padding: 5px 12px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .archetype-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(28px, 5.5vw, 38px);
      line-height: 1.1;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .archetype-tagline {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--g-blue);
      margin-bottom: 12px;
    }

    .archetype-desc {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--ink-muted);
      margin-bottom: 18px;
    }

    .giveaway-box {
      background: #FEF9C3;
      border: 2px solid var(--ink);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .share-section {
      padding-top: 18px;
      border-top: 1.5px dashed var(--border);
    }

    .social-strip-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
      text-align: center;
      margin: 18px 0 10px;
    }

    .social-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .social-btn {
      background: var(--surface);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 10px 6px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .social-btn:hover {
      background: var(--surface-subtle);
      transform: translateY(-1px);
      box-shadow: 0 3px 0 var(--ink);
    }

    .social-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .share-toast {
      margin-top: 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--g-blue);
      text-align: center;
      min-height: 18px;
    }

    .save-status {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--g-green);
      text-align: center;
      min-height: 18px;
    }

    @media (max-width: 500px) {
      .option-key, .hint-text { display: none; }
      .welcome-card { padding: 28px 20px; }
      .social-row { grid-template-columns: repeat(2, 1fr); }
      .stage-seg-label { font-size: 9px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-inner">
      <div class="top-row">
        <div class="brand-badge">
          <span class="g-dots"><span></span><span></span><span></span><span></span></span>
          GDG Girona
        </div>
        <div class="right-controls">
          <div class="lang-switch" role="group" aria-label="Language selector">
            <button type="button" class="lang-btn active" data-lang="en">EN</button>
            <button type="button" class="lang-btn" data-lang="es">ES</button>
            <button type="button" class="lang-btn" data-lang="ca">CA</button>
          </div>
          <div class="step-counter" id="step-counter" style="display:none;">1 / 16</div>
        </div>
      </div>
      <div class="stage-track" id="stage-track" style="display:none;">
        <div class="stage-seg" id="seg-0">
          <span class="stage-seg-label" id="seg-label-0">1. Profile</span>
          <div class="stage-seg-bar"><div class="stage-seg-fill" id="fill-0"></div></div>
        </div>
        <div class="stage-seg" id="seg-1">
          <span class="stage-seg-label" id="seg-label-1">2. Formats</span>
          <div class="stage-seg-bar"><div class="stage-seg-fill" id="fill-1"></div></div>
        </div>
        <div class="stage-seg" id="seg-2">
          <span class="stage-seg-label" id="seg-label-2">3. Perks</span>
          <div class="stage-seg-bar"><div class="stage-seg-fill" id="fill-2"></div></div>
        </div>
        <div class="stage-seg" id="seg-3">
          <span class="stage-seg-label" id="seg-label-3">4. Tech & Draw</span>

          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)

    /**

     * TOURIST SOUVENIR T-SHIRT STORY CARD GENERATOR (1080x1920 PNG)
     * ============================================================================
     */
    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(" ");
      let line = "";
      let currentY = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + " ";
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, currentY);
          line = words[n] + " ";
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, currentY);
      return currentY;
    }

    function drawTShirtSilhouette(ctx, cx, cy) {
      ctx.save();
      // Drop shadow for the tee
      ctx.fillStyle = "#0F172A";
      ctx.beginPath();
      ctx.moveTo(cx - 170, cy - 220);
      ctx.lineTo(cx - 330, cy - 130);
      ctx.lineTo(cx - 270, cy - 20);
      ctx.lineTo(cx - 185, cy - 65);
      ctx.lineTo(cx - 185, cy + 280);
      ctx.lineTo(cx + 205, cy + 280);
      ctx.lineTo(cx + 205, cy - 65);
      ctx.lineTo(cx + 290, cy - 20);
      ctx.lineTo(cx + 350, cy - 130);
      ctx.lineTo(cx + 190, cy - 220);
      ctx.quadraticCurveTo(cx + 10, cy - 165, cx - 170, cy - 220);
      ctx.closePath();
      ctx.fill();

      // Crisp White Tourist Tee Body
      ctx.fillStyle = "#FFFFFF";
      ctx.strokeStyle = "#0F172A";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(cx - 180, cy - 232);
      ctx.lineTo(cx - 340, cy - 142);
      ctx.lineTo(cx - 280, cy - 32);
      ctx.lineTo(cx - 195, cy - 77);
      ctx.lineTo(cx - 195, cy + 268);
      ctx.lineTo(cx + 195, cy + 268);
      ctx.lineTo(cx + 195, cy - 77);
      ctx.lineTo(cx + 280, cy - 32);
      ctx.lineTo(cx + 340, cy - 142);
      ctx.lineTo(cx + 180, cy - 232);
      ctx.quadraticCurveTo(cx, cy - 175, cx - 180, cy - 232);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Collar rib
      ctx.beginPath();
      ctx.arc(cx, cy - 232, 74, 0.12 * Math.PI, 0.88 * Math.PI);
      ctx.stroke();

      // Retro Google 4-color stripes across chest
      const colors = ["#4285F4", "#EA4335", "#FBBC05", "#34A853"];
      colors.forEach((col, i) => {
        ctx.fillStyle = col;
        ctx.fillRect(cx - 160, cy - 115 + i * 11, 320, 8);
      });

      // Tourist T-Shirt Slogan printed on the tee
      ctx.fillStyle = "#0F172A";
      ctx.textAlign = "center";
      ctx.font = "800 32px 'Space Grotesk', sans-serif";
      ctx.fillText("I WENT TO", cx, cy - 22);

      ctx.fillStyle = "#EA4335";
      ctx.font = "800 42px 'Space Grotesk', sans-serif";
      ctx.fillText("GDG GIRONA", cx, cy + 28);

      ctx.fillStyle = "#4285F4";
      ctx.font = "800 42px 'Space Grotesk', sans-serif";
      ctx.fillText("DEVFEST", cx, cy + 76);

      ctx.fillStyle = "#0F172A";
      ctx.font = "700 24px 'Plus Jakarta Sans', sans-serif";
      ctx.fillText("AND ALL I GOT WAS", cx, cy + 128);
      ctx.fillText("THIS DIGITAL T-SHIRT", cx, cy + 162);

      // Little Google dots at bottom hem
      colors.forEach((col, i) => {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(cx - 36 + i * 24, cy + 215, 7, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    async function downloadTouristTeeCard() {
      const arch = state.archetype;
      if (!arch) return;

      const canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = 1920;
      const ctx = canvas.getContext("2d");

      // Futuristic Grid Background
      ctx.fillStyle = "#F8FAFC";
      ctx.fillRect(0, 0, 1080, 1920);

      ctx.strokeStyle = "rgba(66, 133, 244, 0.12)";
      ctx.lineWidth = 2;
      for (let x = 0; x <= 1080; x += 48) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1920); ctx.stroke();
      }
      for (let y = 0; y <= 1920; y += 48) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1080, y); ctx.stroke();
      }

      // Top Header Pill

    /**

    const stageContainer = document.getElementById("stage-container");
    const stepCounter = document.getElementById("step-counter");
    const stageTrack = document.getElementById("stage-track");
    const appFooter = document.getElementById("app-footer");
    const btnBack = document.getElementById("btn-back");

    function setThemeAccent(stageIdx) {
      const color = STAGE_COLORS[stageIdx] || STAGE_COLORS[0];
      const soft = STAGE_SOFTS[stageIdx] || STAGE_SOFTS[0];
      document.documentElement.style.setProperty("--active-accent", color);
      document.documentElement.style.setProperty("--active-soft", soft);
      btnNext.style.background = color;
      btnNext.style.color = stageIdx === 2 ? "#0F172A" : "#FFFFFF";
    }

    function updateProgress(activeQuestions) {
      const t = UI[state.lang];
      const q = activeQuestions[state.currentIndex];
      setThemeAccent(q.stage);

      stepCounter.style.display = "block";
      stageTrack.style.display = "grid";
      stepCounter.textContent = `${state.currentIndex + 1} / ${activeQuestions.length}`;

      [0, 1, 2, 3].forEach(idx => {
        const seg = document.getElementById(`seg-${idx}`);
        const lbl = document.getElementById(`seg-label-${idx}`);
        const fill = document.getElementById(`fill-${idx}`);
        lbl.textContent = t.stages[idx];
        seg.classList.remove("active", "done");

        const stageQs = activeQuestions.filter(item => item.stage === idx);
        const pos = stageQs.findIndex(item => item.id === q.id);

        if (idx < q.stage) {
          seg.classList.add("done");
          fill.style.width = "100%";
        } else if (idx === q.stage) {
          seg.classList.add("active");
          const pct = Math.round(((pos + 1) / stageQs.length) * 100);
          fill.style.width = `${pct}%`;
        } else {
          fill.style.width = "0%";
        }
      });

      btnBack.textContent = t.backBtn;
      btnBack.style.visibility = state.currentIndex === 0 ? "hidden" : "visible";
      btnNext.textContent = q.isLast ? t.finishBtn : t.nextBtn;
    }

    function renderQuestion() {
      const lang = state.lang;
      const t = UI[lang];
      const activeQuestions = getActiveQuestions();

      }

      appFooter.style.display = "block";
      updateProgress(activeQuestions);

      if (q.type === "single" || q.type === "single_with_other") {
        const currentVal = state.answers[q.id];
        bodyHTML = `<div class="options-grid">` + q.options.map((opt, idx) => {
          const isSelected = currentVal === opt.value;
          return `
            <button type="button" class="option-card ${isSelected ? "selected" : ""}" data-val="${opt.value}">
              <span class="option-emoji">${opt.emoji}</span>
              <div class="option-text">
                <div class="option-title">${opt.label[lang]}</div>
                ${opt.desc ? `<div class="option-desc">${opt.desc[lang]}</div>` : ""}
              </div>
              <span class="option-key">${keys[idx]}</span>
            </button>
          `;
        }).join("") + `</div>`;

        if (q.type === "single_with_other" && currentVal === "Other") {
          bodyHTML += `
            <div style="margin-top: 12px;">
              <input type="text" class="text-input" id="other-field-input" placeholder="${t.otherFieldPlaceholder}" value="${state.otherFieldText}" />
            </div>
          `;
        }
      } else if (q.type === "multi") {
        const selectedArr = state.answers[q.id] || [];
        bodyHTML = `<div class="options-grid">` + q.options.map((opt, idx) => {
          const isSelected = selectedArr.includes(opt.value);
          return `
            <button type="button" class="option-card ${isSelected ? "selected" : ""}" data-val="${opt.value}">
              <span class="option-emoji">${opt.emoji}</span>
              <div class="option-text">
                <div class="option-title">${opt.label[lang]}</div>
                ${opt.desc ? `<div class="option-desc">${opt.desc[lang]}</div>` : ""}
              </div>
              <span class="option-key">${isSelected ? "✓" : keys[idx]}</span>
            </button>
          `;
        }).join("") + `</div>`;
      } else if (q.type === "rank") {
        const currentOrder = state.answers[q.id] || q.items.map(i => i.value);
        bodyHTML = `<div class="rank-list">` + currentOrder.map((val, idx) => {
          const itemObj = q.items.find(i => i.value === val);
          return `
            <div class="rank-item ${idx === 0 ? "top-pick" : ""}">
              <div class="rank-badge">#${idx + 1}</div>
              <span class="option-emoji">${itemObj.emoji}</span>
              <div class="option-text">
                <div class="option-title">${itemObj.label[lang]}</div>
                <div class="option-desc">${itemObj.desc[lang]}</div>
              </div>
              <div class="rank-controls">
                <button type="button" class="rank-arrow" data-move="up" data-idx="${idx}" ${idx === 0 ? "disabled" : ""} aria-label="Move up">↑</button>
                <button type="button" class="rank-arrow" data-move="down" data-idx="${idx}" ${idx === currentOrder.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button>
              </div>
            </div>
          `;
        }).join("") + `</div><div class="tag-count" style="margin-top:10px;">${t.rankHint}</div>`;
      } else if (q.type === "tags_translated") {
        const selectedArr = state.answers[q.id] || [];
        bodyHTML = `
          <div class="tags-cloud">
            ${q.tags.map(tagObj => {
              const isSelected = selectedArr.includes(tagObj.value);
              return `<button type="button" class="tag-pill ${isSelected ? "selected" : ""}" data-tag="${tagObj.value}">${isSelected ? "✓ " : ""}${tagObj.label[lang]}</button>`;
            }).join("")}
          </div>
          <div class="tag-count">${t.selectedCount(selectedArr.length)}</div>
        `;
      } else if (q.type === "tags_raw") {
        const selectedArr = state.answers[q.id] || [];
        bodyHTML = `
          <div class="tags-cloud">
            ${q.tags.map(tag => {
              const isSelected = selectedArr.includes(tag);
              return `<button type="button" class="tag-pill ${isSelected ? "selected" : ""}" data-tag="${tag}">${isSelected ? "✓ " : ""}${tag}</button>`;
            }).join("")}
          </div>
          <div class="tag-count">${t.selectedCount(selectedArr.length)}</div>
        `;
      } else if (q.type === "demographics") {
        bodyHTML = `
          <div class="demo-section">
            <span class="demo-label">${q.ageLabel[lang]}</span>
            <div class="mini-pills">
              ${q.ages.map(age => `

              `).join("")}

          <div class="demo-section">
            <span class="demo-label">${q.genderLabel[lang]}</span>

              ${q.genders.map(g => `

        bodyHTML = `

        <div class="slide ${state.direction === "back" ? "back" : ""}">

          <p class="q-subtitle">${q.subtitle[lang]}</p>

    function attachQuestionListeners(q) {
      if (q.type === "single" || q.type === "single_with_other") {
        document.querySelectorAll(".option-card").forEach(btn => {
          btn.addEventListener("click", () => {
            const val = btn.getAttribute("data-val");
            state.answers[q.id] = val;
            if (q.type === "single_with_other" && val === "Other") {
              render();
              const inp = document.getElementById("other-field-input");
              if (inp) inp.focus();
              return;
            }
            render();
            if (q.autoAdvance) setTimeout(() => goNext(), 230);
          });
        });

        const otherInp = document.getElementById("other-field-input");
        if (otherInp) {
          otherInp.addEventListener("input", (e) => { state.otherFieldText = e.target.value; });
        }
      } else if (q.type === "multi") {
        document.querySelectorAll(".option-card").forEach(btn => {
          btn.addEventListener("click", () => {
            const val = btn.getAttribute("data-val");
            let arr = state.answers[q.id] || [];
            arr = arr.includes(val) ? arr.filter(i => i !== val) : [...arr, val];
            state.answers[q.id] = arr;
            render();
          });
        });
      } else if (q.type === "rank") {
        document.querySelectorAll(".rank-arrow").forEach(btn => {
          btn.addEventListener("click", () => {
            const idx = parseInt(btn.getAttribute("data-idx"), 10);
            const dir = btn.getAttribute("data-move");
            const arr = [...state.answers[q.id]];
            const swapWith = dir === "up" ? idx - 1 : idx + 1;
            if (swapWith >= 0 && swapWith < arr.length) {
              [arr[idx], arr[swapWith]] = [arr[swapWith], arr[idx]];
              state.answers[q.id] = arr;
              render();
            }
          });
        });
      } else if (q.type === "tags_translated" || q.type === "tags_raw") {
        document.querySelectorAll(".tag-pill").forEach(btn => {
          btn.addEventListener("click", () => {
            const tag = btn.getAttribute("data-tag");
            let arr = state.answers[q.id] || [];
            arr = arr.includes(tag) ? arr.filter(t => t !== tag) : [...arr, tag];
            state.answers[q.id] = arr;
            render();
          });
        });
      } else if (q.type === "demographics") {
        document.querySelectorAll("[data-age]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.answers.age_range = btn.getAttribute("data-age");
            render();
          });
        });
        document.querySelectorAll("[data-gender]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.answers.gender = btn.getAttribute("data-gender");
            render();
            if (state.answers.gender === "Other") {
              const gInp = document.getElementById("other-gender-input");
              if (gInp) gInp.focus();
            }
          });
        });
        const gInp = document.getElementById("other-gender-input");
        if (gInp) {
          gInp.addEventListener("input", (e) => { state.otherGenderText = e.target.value; });
        }
      } else if (q.type === "closing") {
        document.querySelectorAll("[data-fb]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.answers.future_feedback = btn.getAttribute("data-fb");
            render();
          });
        });
        const cInp = document.getElementById("closing-contact-input");
        if (cInp) {
          cInp.focus();
          cInp.addEventListener("input", (e) => {
            state.answers.contact_info = e.target.value;
            if (state.validationMsg) state.validationMsg = "";
          });
        }
      }
    }

            "Starter-kit workshop",
            "Industry deep-dive talks",
            "Open networking & demos"
          ],
          cross_disciplinary_topics: [],
          valuable_perks: [],
          invite_friend_triggers: [],
          tech_radar: [],
          age_range: "",
          gender: "",
          future_feedback: "Yes, count me in",
          contact_info: ""
        };
        state.otherFieldText = "";
        state.otherGenderText = "";
        state.validationMsg = "";
        render();
      });

      const res = await submitSurveyData(payload);
      const statusEl = document.getElementById("save-status");
      if (statusEl) {
        statusEl.textContent = res.ok ? t.savedDb : t.errorDb;
      }
    }

    function goNext() {
      const activeQuestions = getActiveQuestions();
      const q = activeQuestions[state.currentIndex];

      if (q && q.type === "closing") {
        if (!state.answers.contact_info || !state.answers.contact_info.trim()) {
          state.validationMsg = UI[state.lang].contactRequiredErr;
          render();
          return;
        }
      }

      if (state.currentIndex < activeQuestions.length - 1) {
        state.direction = "forward";
        state.currentIndex++;
        render();
      } else {
        state.screen = "result";
        render();
      }
    }

    function goBack() {
      if (state.currentIndex > 0) {
        state.direction = "back";
        state.currentIndex--;
        render();
      }
    }

    function render() {
      if (state.screen === "welcome") renderWelcome();
      else if (state.screen === "survey") renderQuestion();
      else if (state.screen === "result") renderResult();
    }

    // Language Switcher
    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.lang = btn.getAttribute("data-lang");
        document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      });
    });

    btnNext.addEventListener("click", goNext);
    btnBack.addEventListener("click", goBack);

    document.addEventListener("keydown", (e) => {
      if (state.screen !== "survey") return;
      if (document.activeElement && document.activeElement.tagName === "INPUT") {
        if (e.key === "Enter") { e.preventDefault(); goNext(); }
        return;
      }
      if (e.key === "Enter") { e.preventDefault(); goNext(); }

      const activeQuestions = getActiveQuestions();
      const q = activeQuestions[state.currentIndex];
      const letterIdx = ["A", "B", "C", "D", "E", "F", "G"].indexOf(e.key.toUpperCase());
      if (letterIdx !== -1 && q.options && q.options[letterIdx]) {
        const cards = document.querySelectorAll(".option-card");
        if (cards[letterIdx]) cards[letterIdx].click();
      }
    });

    render();
  </script>
</body>
</html>
